# Broker MQTT de la Practica 2 (va en /etc/mosquitto/conf.d/practica2.conf)
# Escucha en 1883 desde cualquier lugar, pero SOLO con usuario y clave.
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
# (La persistencia de mensajes retenidos ya viene activada en /etc/mosquitto/mosquitto.conf)
